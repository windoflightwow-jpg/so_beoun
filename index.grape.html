    까마득한 날에<br>

    모든 산맥들이<br>

    매화 향기 홀로 아득하니<br>
    내 여기 가난한 노래의 씨를 뿌려라<br></br>

    다시 천고의 뒤에<br>
    백마 타고 오는 초인이 있어<br>
    이 광야에서 목 놓아 부르게 하리라<br></br>
